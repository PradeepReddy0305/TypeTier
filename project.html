<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeTier - Speed Test</title>
    <link rel="icon" type="image/png"
        href="https://cdn-1.webcatalog.io/catalog/typingtest-com/typingtest-com-icon-filled-256.png?v=1714776285985">
    <link rel="stylesheet" href="project.css">
</head>

<body>

    <!-- Navbar Container -->
    <div id="navbar">
        <div id="logo">TypeTier</div>
        <div id="difficulty">
            <button id="easybutton">Easy</button>
            <button id="mediumbutton">Meduim</button>
            <button id="hardbutton">Hard</button>
        </div>
        <div id="scorediv">
            <button id="scorebutton">ScoreBoard</button>
        </div>
    </div>

    <!-- Test View Container -->
    <div id="test-view">
        <div id="typecard">
            <h1 id="startheading">Start your speed test Here :</h1>
            <h2 id="typetext">Select a difficulty mode to begin!</h2>
            <!-- Typing area and submit button (Hidden by default) -->
            <textarea name="wpm" id="speedtest" placeholder="Try your Speed"></textarea>
            <br><br>
            <div id="button-group">
                <button id="submitbutton">Check Speed</button>
                <button id="anotherbutton" style="display: none;">Try Another Question</button>
            </div>
        </div>
    </div>

    <!-- Scoreboard Table View (Hidden by default) -->
    <div id="score-view" style="display: none;">
        <h1>Your Scoreboard</h1>
        <button id="backbutton">Back to Test</button>
        <table id="score-table">
            <thead>
                <tr>
                    <th>Question</th>
                    <th>Type</th>
                    <th>Speed (WPM)</th>
                    <th>Accuracy</th>
                    <th>Mistakes</th>
                    <th>Date & Time</th>
                </tr>
            </thead>
            <tbody id="score-tbody">
                <!-- Dynamic rows inserted here -->
            </tbody>
        </table>
    </div>

    <script src="project.js"></script>
</body>

</html>
